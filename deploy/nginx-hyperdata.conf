limit_req_zone $binary_remote_addr zone=hyperdata_api_requests:1m rate=10r/s;
# This origin has its own Elastic IP and cannot reach desktop or terminal routes.
server {
    listen PRIVATE_IP:80;
    server_name PUBLIC_IP;
    if ($host != "PUBLIC_IP") { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 308 https://PUBLIC_IP$request_uri; }
}
server {
    listen PRIVATE_IP:443 ssl http2;
    server_name PUBLIC_IP;
    if ($host != "PUBLIC_IP") { return 421; }
    ssl_certificate /etc/letsencrypt/live/PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_IP/privkey.pem;
    ssl_client_certificate /etc/nginx/mtls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/hyperdata-error.log crit;
    client_max_body_size 16k;
    client_body_timeout 10s;
    error_page 495 496 =403 /client-cert-required;
    location = /client-cert-required { return 403; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    location ^~ /api/ {
        limit_req zone=hyperdata_api_requests burst=20 nodelay;
        proxy_pass http://unix:/run/hyperdata-api/api.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host PUBLIC_IP;
        proxy_set_header X-Hyperdata-Verified $ssl_client_verify;
        proxy_set_header X-Hyperdata-Certificate $ssl_client_fingerprint;
        proxy_set_header X-Hyperdata-Subject $ssl_client_s_dn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }
    root /opt/hyperdata-runtime/current/public;
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ =404;
    }
}
