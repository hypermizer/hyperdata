name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: python3 -m venv .gateway-test-venv
      - run: .gateway-test-venv/bin/pip install -r deploy/gateway-requirements.txt
      - run: .gateway-test-venv/bin/python -m unittest discover -s test -p '*_test.py'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:edge
      - run: npm run test:runtime
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-16 postgresql-16-pgtap
      - run: bash scripts/install-postgrest.sh
      - run: npm run test:db
